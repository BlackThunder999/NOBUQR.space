<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#06060e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="NOBUQR.SPACE — социальная сеть для свободного общения. Публикуй мысли, делись медиа, находи друзей.">
    <title>NOBUQR.SPACE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="app-container"></div>
    <div id="modalOverlay" class="modal-overlay" onclick="window.closeModal()"></div>
    <div id="modalContainer" class="modal-container"></div>
    <div id="toastContainer" class="toast-container"></div>
    <div id="discordBanner" class="discord-banner" style="display:none;">
        <div class="discord-banner-content">
            <span class="discord-icon">🎮</span>
            <div class="discord-text">
                <strong>Присоединяйся к Discord!</strong>
                <span>Новости, общение, тестирование</span>
            </div>
            <button class="btn btn-small btn-primary" onclick="window.openDiscord()">Открыть</button>
            <button class="discord-close" onclick="window.closeDiscordBanner()">✕</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
