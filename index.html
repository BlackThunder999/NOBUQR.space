<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NobuChirp — Скоро</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 24 24" width="80" height="80" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M15 8a3 3 0 10-6 0"/>
                <path d="M3 20c0-4.418 4.03-8 9-8s9 3.582 9 8"/>
                <path d="M12 2L9 8l-2 4 2 4 2 4 2-4 2-4-2-4-2-4z"/>
            </svg>
        </div>
        <h1>NobuChirp</h1>
        <p class="tagline">Новая эра социальных сетей</p>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        <p class="status">Разработка идёт полным ходом</p>
        <p class="eta" id="countdown">Запуск через: 7 дней</p>
        <div class="features">
            <div class="feature">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L9 8l-2 4 2 4 2 4 2-4 2-4-2-4-2-4z"/></svg>
                <span>Чирпы до 1000 символов</span>
            </div>
            <div class="feature">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                <span>Лайки и реакции</span>
            </div>
            <div class="feature">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                <span>Кастомизация профиля</span>
            </div>
        </div>
        <p class="contact">Следите за обновлениями на <a href="https://nobuqr.space">NobuSocial</a></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
