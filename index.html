<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NobuSocial</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-sha512/0.8.0/sha512.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="app">
        <!-- Форма входа/регистрации -->
        <div id="auth-screen" class="screen active">
            <div class="auth-container">
                <div class="auth-logo">NobuSocial</div>
                <div id="auth-tabs" class="auth-tabs">
                    <button class="auth-tab active" onclick="switchAuthTab('login')">Вход</button>
                    <button class="auth-tab" onclick="switchAuthTab('register')">Регистрация</button>
                </div>
                <div id="login-form" class="auth-form active">
                    <input type="email" id="login-email" placeholder="Email" class="input-field">
                    <input type="password" id="login-password" placeholder="Пароль" class="input-field">
                    <button class="btn btn-primary" onclick="login()">Войти</button>
                </div>
                <div id="register-form" class="auth-form">
                    <input type="email" id="reg-email" placeholder="Email" class="input-field">
                    <input type="text" id="reg-username" placeholder="Имя пользователя" class="input-field">
                    <input type="text" id="reg-handle" placeholder="@handle" class="input-field">
                    <input type="password" id="reg-password" placeholder="Пароль" class="input-field">
                    <button class="btn btn-primary" onclick="register()">Зарегистрироваться</button>
                </div>
                <div id="auth-toast" class="toast"></div>
            </div>
        </div>

        <!-- Основной интерфейс -->
        <div id="main-screen" class="screen">
            <div class="desktop-layout">
                <!-- Боковая панель для ПК -->
                <div class="sidebar-left">
                    <div class="sidebar-header">NobuSocial</div>
                    <div class="sidebar-nav">
                        <button class="nav-btn active" onclick="showFeed('latest')">Главная</button>
                        <button class="nav-btn" onclick="showFeed('popular')">Популярное</button>
                        <button class="nav-btn" onclick="showFeed('subscriptions')">Подписки</button>
                    </div>
                    <div class="sidebar-footer">
                        <div class="user-mini" id="sidebar-user">
                            <div class="user-avatar-mini" id="sidebar-avatar"></div>
                            <span id="sidebar-handle"></span>
                        </div>
                        <button class="btn btn-secondary" onclick="logout()">Выйти</button>
                    </div>
                </div>

                <!-- Основной контент -->
                <div class="main-content" id="main-content">
                    <!-- Верхняя панель для мобильных -->
                    <div class="mobile-header">
                        <div class="mobile-logo">NobuSocial</div>
                        <div class="mobile-header-actions">
                            <button class="icon-btn" onclick="showNotifications()">🔔</button>
                        </div>
                    </div>

                    <!-- Лента -->
                    <div id="feed-container" class="feed-container">
                        <div class="feed-tabs">
                            <button class="feed-tab active" onclick="showFeed('latest')">Последние</button>
                            <button class="feed-tab" onclick="showFeed('popular')">Популярные</button>
                            <button class="feed-tab" onclick="showFeed('subscriptions')">Подписки</button>
                        </div>
                        <div id="feed-posts"></div>
                        <div id="feed-loader" class="loader" style="display:none;">Загрузка...</div>
                    </div>

                    <!-- Профиль -->
                    <div id="profile-container" class="profile-container" style="display:none;">
                        <div class="profile-banner" id="profile-banner"></div>
                        <div class="profile-header">
                            <div class="profile-avatar" id="profile-avatar"></div>
                            <div class="profile-info">
                                <div class="profile-name" id="profile-name"></div>
                                <div class="profile-handle" id="profile-handle-display"></div>
                                <div class="profile-bio" id="profile-bio"></div>
                                <div class="profile-meta">
                                    <span id="profile-location"></span>
                                    <a id="profile-link" target="_blank"></a>
                                </div>
                                <div class="profile-stats">
                                    <span id="profile-chirps">0 чирпов</span>
                                    <span id="profile-followers">0 подписчиков</span>
                                    <span id="profile-following">0 подписок</span>
                                </div>
                                <div class="profile-actions" id="profile-actions">
                                    <button id="follow-btn" class="btn btn-primary" onclick="toggleFollow()">Подписаться</button>
                                    <button id="edit-profile-btn" class="btn
